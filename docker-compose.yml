version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile  # TODO: create backend/Dockerfile
    image: iot-shieldai-backend:latest
    container_name: shieldai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./datasets:/datasets:ro
      - ./reports:/reports
    environment:
      - APP_ENV=development
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - sandbox
    networks:
      - shieldai

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile  # TODO: create frontend/Dockerfile
    image: iot-shieldai-frontend:latest
    container_name: shieldai-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    networks:
      - shieldai

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: iot-shieldai-sandbox:latest
    container_name: shieldai-sandbox
    volumes:
      - ./datasets:/workspace/datasets:ro
    # The sandbox container runs a long-lived bash process;
    # the backend invokes specific commands via docker exec.
    command: sleep infinity
    networks:
      - shieldai

networks:
  shieldai:
    driver: bridge
