[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN001",  # Missing type annotation for function arguments (relax for stubs)
    "ANN002",  # Missing type annotation for *args
    "ANN003",  # Missing type annotation for **kwargs
    "ANN101",  # Missing type annotation for self
    "ANN201",  # Missing return type annotation (relax for stubs)
    "ANN202",
    "ANN204",
    "B008",    # Do not perform function calls in default arguments (FastAPI pattern)
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["ANN", "S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
